
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <!-- Profile CSS -->
    <link rel="stylesheet"
          th:href="@{/css/profile.css}">

</head>

<body>

<div class="profile-container">

    <div class="profile-card">

        <!-- Profile Icon -->
        <div class="profile-icon">
            👤
        </div>

        <!-- Heading -->
        <h2>My Profile</h2>

        <p class="subtitle">
            Welcome to your profile
        </p>


        <!-- User Information -->

        <div class="profile-info">

            <p>
                <strong>Full Name :</strong>
                <span th:text="${modelUser.name}">
                    Satish Kumar
                </span>
            </p>

            <p>
                <strong>Email Id :</strong>
                <span th:text="${modelUser.email}">
                    satish@gmail.com
                </span>
            </p>

            <p>
                <strong>Phone Number :</strong>
                <span th:text="${modelUser.phoneNo}">
                    9876543210
                </span>
            </p>

        </div>


        <!-- Profile Status -->

        <div class="profile-status">
            ✓ Account Active
        </div>


        <!-- Navigation Links -->

        <div class="links">

            <a th:href="@{/}">
                🏠 Home Page
            </a>

            <a th:href="@{/loginPage}">
                🔐 Login Page
            </a>

        </div>

    </div>

</div>

</body>

</html>
